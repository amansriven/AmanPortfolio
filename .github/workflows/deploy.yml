name: Deploy

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without pushing.
  workflow_dispatch:

# Never let two deploys race; the newer commit wins.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      # Fail before deploying rather than shipping a broken build.
      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build
        env:
          # Public Turnstile site key. Baked into the HTML at build time, so it
          # is a repository *variable*, not a secret.
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}

      - name: Deploy
        # The Astro adapter writes the real worker config during the build.
        run: npx wrangler deploy -c dist/server/wrangler.json
        env:
          # The token is a real credential, so it lives in Secrets.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # The account ID is just an identifier, so it lives in Variables.
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
